name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Wago is deliberately not wired up. The packager uploads there only when
      # WAGO_API_TOKEN is in the environment, so leaving it out is the whole of
      # it -- do not add the secret back "just in case", because an X-Wago-ID in
      # the .toc plus a present token is all it takes to start publishing there.
      #
      # CurseForge uploads once the .toc carries ## X-Curse-Project-ID *and*
      # CF_API_KEY is set on this repository. Neither exists yet, so today this
      # step builds the zip and stops there -- no error, no upload. It starts
      # publishing the moment the id and the secret are added, with no change
      # here.
      - name: Package and Release
        uses: BigWigsMods/packager@master
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: .release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload packaged addon (debug)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-addon
          path: .release/*.zip
          retention-days: 7

      # There is no zip audit here on purpose. CurseForge refuses an archive
      # carrying web content and reports it out of band, so the packager prints
      # Success! and the workflow stays green -- BitForge shipped two releases
      # that way. What made that possible there is externals, which arrive as
      # whole repository checkouts with docs/ attached. This package has none:
      # every file in the zip comes from this repository and none of them is
      # web content. Add the check back the day .pkgmeta grows an external.

      - name: Delete old successful runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow="release.yaml" \
            --status=success \
            --json databaseId \
            --jq '.[1:].[].databaseId' \
          | xargs -r -I{} gh run delete --repo "${{ github.repository }}" {}
