name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Neither CurseForge nor Wago is wired up, and both are left out the same
      # way: the packager uploads to a site only when that site's token is in
      # its environment, so the whole of not publishing there is not putting
      # CF_API_KEY or WAGO_API_TOKEN here. This step builds the zip and stops.
      #
      # Do not add either back "just in case". A token here plus the matching
      # id in the .toc -- ## X-Curse-Project-ID, ## X-Wago-ID -- is all it takes
      # to start publishing, and each half is inert alone, so the pair arrives
      # by accident rather than by decision. Adding a distribution channel is
      # the user's call to make explicitly, not a gap for a later session to
      # close.
      - name: Package and Release
        uses: BigWigsMods/packager@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: .release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload packaged addon (debug)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-addon
          path: .release/*.zip
          retention-days: 7

      # There is no zip audit here, for two reasons that stack. The check
      # existed because CurseForge refuses an archive carrying web content and
      # reports it out of band -- the packager prints Success! and the workflow
      # stays green, which is how BitForge shipped two releases that never
      # arrived. Nothing is uploaded there from here any more, and the thing
      # that made it possible was externals, which arrive as whole repository
      # checkouts with docs/ attached. This package has none. Bring the check
      # back the day either of those changes.

      - name: Delete old successful runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow="release.yaml" \
            --status=success \
            --json databaseId \
            --jq '.[1:].[].databaseId' \
          | xargs -r -I{} gh run delete --repo "${{ github.repository }}" {}
